<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title"><title id="title">A local app can use different processing routes</title><rect width="900" height="430" rx="24" fill="#f8f3e9"/><g font-family="Arial, sans-serif" fill="#252c2c"><text x="36" y="64" font-size="30" font-weight="700">A local app can use different processing routes</text><rect x="30" y="100" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="100" width="8" height="142" rx="4" fill="#587d78"/><text x="58" y="140" font-size="27" font-weight="700">Fully local workflow</text><text x="58" y="180" font-size="27">Input → model on your PC → output</text><text x="58" y="217" font-size="23" fill="#5c6664">Separate setup downloads from generation</text><rect x="30" y="260" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="260" width="8" height="142" rx="4" fill="#ba812e"/><text x="58" y="300" font-size="27" font-weight="700">External API workflow</text><text x="58" y="340" font-size="27">Input → remote service → output</text><text x="58" y="377" font-size="23" fill="#5c6664">Check data transfer, billing and retention</text></g></svg>