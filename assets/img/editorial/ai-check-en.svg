<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title"><title id="title">Three steps for organizing digital work</title><rect width="900" height="590" rx="24" fill="#f8f3e9"/><g font-family="Arial, sans-serif" fill="#252c2c"><text x="36" y="64" font-size="30" font-weight="700">Three steps for organizing digital work</text><rect x="30" y="100" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><text x="58" y="140" font-size="27" font-weight="700">01 · Define the result</text><text x="58" y="180" font-size="27">Choose one outcome for this task</text><text x="58" y="217" font-size="23" fill="#5c6664">Save extra ideas separately</text><rect x="30" y="260" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><text x="58" y="300" font-size="27" font-weight="700">02 · Reduce interruptions</text><text x="58" y="340" font-size="27">Manage alerts, feeds and tabs</text><text x="58" y="377" font-size="23" fill="#5c6664">Change one setting at a time</text><rect x="30" y="420" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><text x="58" y="460" font-size="27" font-weight="700">03 · Compare your notes</text><text x="58" y="500" font-size="27">Track outcomes and interruptions</text><text x="58" y="537" font-size="23" fill="#5c6664">Undo changes that do not help</text></g></svg>