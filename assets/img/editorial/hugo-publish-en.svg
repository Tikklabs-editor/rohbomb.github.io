<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title"><title id="title">From source edits to a verified publication</title><rect width="900" height="590" rx="24" fill="#f8f3e9"/><g font-family="Arial, sans-serif" fill="#252c2c"><text x="36" y="64" font-size="30" font-weight="700">From source edits to a verified publication</text><rect x="30" y="100" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="100" width="8" height="142" rx="4" fill="#587d78"/><text x="58" y="140" font-size="27" font-weight="700">01 · Edit article and images</text><text x="58" y="180" font-size="27">Update the repository</text><text x="58" y="217" font-size="23" fill="#5c6664">The source has changed</text><rect x="30" y="260" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="260" width="8" height="142" rx="4" fill="#ba812e"/><text x="58" y="300" font-size="27" font-weight="700">02 · Build and deploy</text><text x="58" y="340" font-size="27">Hugo → GitHub Pages</text><text x="58" y="377" font-size="23" fill="#5c6664">Check the deployment result</text><rect x="30" y="420" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="420" width="8" height="142" rx="4" fill="#587d78"/><text x="58" y="460" font-size="27" font-weight="700">03 · Verify the live URL</text><text x="58" y="500" font-size="27">Check text, images and links</text><text x="58" y="537" font-size="23" fill="#5c6664">Visitors can see the update</text></g></svg>