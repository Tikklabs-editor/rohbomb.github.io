<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title"><title id="title">같은 앱에서도 처리 위치는 다릅니다</title><rect width="900" height="430" rx="24" fill="#f8f3e9"/><g font-family="Arial, sans-serif" fill="#252c2c"><text x="36" y="64" font-size="30" font-weight="700">같은 앱에서도 처리 위치는 다릅니다</text><rect x="30" y="100" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="100" width="8" height="142" rx="4" fill="#587d78"/><text x="58" y="140" font-size="27" font-weight="700">완전 로컬 구성</text><text x="58" y="180" font-size="27">입력 → 내 PC의 모델 → 결과</text><text x="58" y="217" font-size="23" fill="#5c6664">설치·모델 다운로드와 생성 처리는 구분</text><rect x="30" y="260" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="260" width="8" height="142" rx="4" fill="#ba812e"/><text x="58" y="300" font-size="27" font-weight="700">외부 API 구성</text><text x="58" y="340" font-size="27">입력 → 외부 서비스 → 결과</text><text x="58" y="377" font-size="23" fill="#5c6664">외부 전달·사용료·보관 정책 확인</text></g></svg>