<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title"><title id="title">파일 수정에서 게시 확인까지</title><rect width="900" height="590" rx="24" fill="#f8f3e9"/><g font-family="Arial, sans-serif" fill="#252c2c"><text x="36" y="64" font-size="30" font-weight="700">파일 수정에서 게시 확인까지</text><rect x="30" y="100" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="100" width="8" height="142" rx="4" fill="#587d78"/><text x="58" y="140" font-size="27" font-weight="700">01 · 원고와 이미지 수정</text><text x="58" y="180" font-size="27">저장소에 변경 반영</text><text x="58" y="217" font-size="23" fill="#5c6664">파일이 바뀐 상태</text><rect x="30" y="260" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="260" width="8" height="142" rx="4" fill="#ba812e"/><text x="58" y="300" font-size="27" font-weight="700">02 · 빌드와 배포</text><text x="58" y="340" font-size="27">Hugo → GitHub Pages</text><text x="58" y="377" font-size="23" fill="#5c6664">성공 여부 확인</text><rect x="30" y="420" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><rect x="30" y="420" width="8" height="142" rx="4" fill="#587d78"/><text x="58" y="460" font-size="27" font-weight="700">03 · 실제 주소 확인</text><text x="58" y="500" font-size="27">본문·이미지·링크 점검</text><text x="58" y="537" font-size="23" fill="#5c6664">방문자에게 반영된 상태</text></g></svg>