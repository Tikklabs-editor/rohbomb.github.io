<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title"><title id="title">디지털 작업을 정리하는 세 단계</title><rect width="900" height="590" rx="24" fill="#f8f3e9"/><g font-family="Arial, sans-serif" fill="#252c2c"><text x="36" y="64" font-size="30" font-weight="700">디지털 작업을 정리하는 세 단계</text><rect x="30" y="100" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><text x="58" y="140" font-size="27" font-weight="700">01 · 결과 정하기</text><text x="58" y="180" font-size="27">이번 작업에서 끝낼 것 하나</text><text x="58" y="217" font-size="23" fill="#5c6664">새 아이디어는 별도 메모</text><rect x="30" y="260" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><text x="58" y="300" font-size="27" font-weight="700">02 · 방해 줄이기</text><text x="58" y="340" font-size="27">알림·추천·탭을 따로 관리</text><text x="58" y="377" font-size="23" fill="#5c6664">한 번에 한 가지 설정 변경</text><rect x="30" y="420" width="840" height="142" rx="16" fill="#fff" stroke="#d7ded9"/><text x="58" y="460" font-size="27" font-weight="700">03 · 기록 비교하기</text><text x="58" y="500" font-size="27">완료한 일과 중단 계기 기록</text><text x="58" y="537" font-size="23" fill="#5c6664">효과가 없으면 원래 설정으로</text></g></svg>